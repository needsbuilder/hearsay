[project]
name = "hearsay"
version = "0.1.0"
description = "Check what coding agents claim about the outside world against primary sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "packaging>=24.0",
    "pydantic>=2.7",
]

[project.scripts]
hearsay = "hearsay.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearsay"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
